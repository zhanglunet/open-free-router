name: CI

# The Python CLI, the Cloudflare worker, the npm launcher and the generated
# site all ship from this repo; every push has to prove all four still work.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devlog:
    name: Public devlog entry
    # AGENTS.md: every user-visible feature, fix, hardening, release or website
    # change must carry one concise Chinese devlog entry in the same change set.
    # build-site.mjs validates the *shape* of each entry but cannot know whether
    # a change was user-visible, so until now the rule rested entirely on review
    # — and it was missed exactly that way on PR #18, past the build gate, the
    # test suites and the whole-site audit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a devlog entry for user-visible site changes
        env:
          # PR-authored text is never interpolated into the script body; it
          # arrives as an environment variable so it cannot become shell code.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          CHANGED=$(git diff --name-only FETCH_HEAD...HEAD)

          # site/data/** is excluded on purpose: the scheduled data-refresh PR
          # only republishes catalog.json and provider-status.json, which is a
          # data refresh rather than a behaviour change, and requiring a devlog
          # entry there would deadlock that workflow against this one.
          VISIBLE=$(printf '%s\n' "$CHANGED" | grep '^site/' | grep -v '^site/data/' || true)
          if [ -z "$VISIBLE" ]; then
            echo "no user-visible site files changed"
            exit 0
          fi

          if printf '%s\n' "$CHANGED" | grep -qx 'site/data/devlog.json'; then
            echo "devlog entry present alongside:"
            printf '%s\n' "$VISIBLE" | sed 's/^/  /'
            exit 0
          fi

          # Escape hatch for genuine non-visible edits (a comment, a pure
          # refactor). It is deliberately visible in the PR itself rather than
          # hidden in CI config, so skipping is a reviewable decision.
          case "$PR_TITLE $PR_BODY" in
            *"[skip devlog]"*)
              echo "::warning::site/ changed with no devlog entry; honoured [skip devlog] from the PR title or body"
              exit 0
              ;;
          esac

          echo "::error::AGENTS.md requires one concise Chinese devlog entry in the same change set as a user-visible website change"
          echo "Changed under site/ (excluding site/data/):"
          printf '%s\n' "$VISIBLE" | sed 's/^/  /'
          echo
          echo 'Add one with:  npm run log:add -- --title "标题" --summary "摘要" --type improvement'
          echo 'If this change is genuinely not user-visible, put [skip devlog] in the PR title or body.'
          exit 1

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

      - name: Public catalog is reproducible from the registry
        # An age gate can be cleared by hand-editing a timestamp; this cannot.
        # Re-exporting with generated_at pinned to the committed value and
        # diffing catches what age structurally misses — schema drift, a typo'd
        # --registry, a stale api field — because the only way to make it pass
        # is to actually run the exporter.
        run: |
          NOW=$(python -c "import json;print(json.load(open('site/data/catalog.json'))['generated_at'])")
          python scripts/export-public-catalog.py \
            --registry src/open_free_router/registry.default.yaml \
            --status docs/provider-status.json \
            --profiles docs/provider-profiles.json \
            --now "$NOW" \
            --output /tmp/catalog-reexport.json
          if ! git diff --no-index --quiet site/data/catalog.json /tmp/catalog-reexport.json; then
            echo "::error::site/data/catalog.json does not match a re-export from the registry"
            git diff --no-index site/data/catalog.json /tmp/catalog-reexport.json | head -60
            exit 1
          fi
          echo "published catalog matches a fresh export"

      - name: CLI smoke test
        # The npm install guide tells users to verify with these two commands,
        # so they are part of the contract, not just internal plumbing.
        run: |
          open-free-router --version
          open-free-router models --json > /dev/null
          open-free-router protocols --json > /dev/null

  node:
    name: Worker, npm package and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Worker tests
        run: npm run test:web

      - name: npm launcher tests
        run: npm run test:npm

      - name: Build site
        run: npm run build

      - name: Static site audit
        # Runs without a browser: link/asset integrity, anchors, metadata,
        # sitemap and robots consistency, CSP-blocking markup.
        run: npm run test:site -- --static

      - name: Worker dry-run
        run: npx wrangler deploy --dry-run

      - name: Freshness gate fails on a stale catalog
        # The PRD's acceptance criterion, executed rather than asserted. Last on
        # purpose: build-site.mjs starts by removing web/, so the deliberately
        # failing build leaves it half-written, and the steps above consume it.
        # A fixed 2020 date rather than now-30d, so the check means the same
        # thing when CI re-runs on an old commit (the gate anchors to the commit
        # date, not the wall clock).
        run: |
          cp site/data/catalog.json /tmp/catalog-orig.json
          node -e '
            const fs = require("fs");
            const path = "site/data/catalog.json";
            const catalog = JSON.parse(fs.readFileSync(path, "utf8"));
            catalog.generated_at = "2020-01-01T00:00:00.000Z";
            fs.writeFileSync(path, JSON.stringify(catalog, null, 2) + "\n");
          '
          status=0
          npm run build > /tmp/gate.log 2>&1 || status=$?
          cp /tmp/catalog-orig.json site/data/catalog.json
          if [ "$status" -eq 0 ]; then
            echo "::error::the freshness gate did not fire on a stale catalog"
            exit 1
          fi
          if ! grep -q "公开目录数据新鲜度校验失败" /tmp/gate.log; then
            echo "::error::the build failed, but not because of the freshness gate"
            cat /tmp/gate.log
            exit 1
          fi
          echo "gate fired as expected"
          npm run build
