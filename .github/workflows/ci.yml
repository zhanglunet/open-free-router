name: CI

# The Python CLI, the Cloudflare worker, the npm launcher and the generated
# site all ship from this repo; every push has to prove all four still work.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

      - name: CLI smoke test
        # The npm install guide tells users to verify with these two commands,
        # so they are part of the contract, not just internal plumbing.
        run: |
          open-free-router --version
          open-free-router models --json > /dev/null
          open-free-router protocols --json > /dev/null

  node:
    name: Worker, npm package and site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Worker tests
        run: npm run test:web

      - name: npm launcher tests
        run: npm run test:npm

      - name: Build site
        run: npm run build

      - name: Static site audit
        # Runs without a browser: link/asset integrity, anchors, metadata,
        # sitemap and robots consistency, CSP-blocking markup.
        run: npm run test:site -- --static

      - name: Worker dry-run
        run: npx wrangler deploy --dry-run
